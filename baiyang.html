<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>白杨大陆：智械低语</title>
<style>
:root {
  --pip: #4ec9b0; --pip-rgb: 78,201,176; --pip-soft: #c9fff0; --pip-soft-rgb: 201,255,240;
  --scene-bg: url("assets/scenes/wutong-avenue.jpg");
}
* { margin:0; padding:0; box-sizing:border-box }
html { height:100%; overflow:hidden }
body {
  background:#0c0c0c; color:var(--pip); font-family:'Courier New','PingFang SC',monospace;
  overflow:hidden; width:100vw; height:100vh; min-height:100dvh; font-size:15px; line-height:1.7; position:relative;
  -webkit-text-size-adjust:100%; touch-action:manipulation;
}
body::before {
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:linear-gradient(90deg, rgba(0,0,0,.76), rgba(0,0,0,.48) 48%, rgba(0,0,0,.82)), var(--scene-bg);
  background-size:cover; background-position:center; transform:scale(1.02);
  filter:saturate(.9) contrast(.95); transition:background-image .85s ease, filter .85s ease;
}
body::after {
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(circle at 50% 18%, rgba(var(--pip-rgb),.16), transparent 32%), linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.62));
}
.crt {
  position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:1000; pointer-events:none;
  background:linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,.25) 50%), linear-gradient(90deg, rgba(255,0,0,.04), rgba(0,255,0,.015), rgba(0,0,255,.04));
  background-size:100% 2px, 3px 100%;
}
.scanline {
  position:fixed; width:100%; height:100px; z-index:1001; pointer-events:none;
  background:linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(var(--pip-rgb),.04) 50%, rgba(0,0,0,0) 100%);
  opacity:.08; animation:scan 8s linear infinite;
}
@keyframes scan { 0%{bottom:100%} 100%{bottom:-100px} }
#app {
  position:relative; z-index:1; width:100%; height:100vh; min-height:100dvh; display:flex;
  max-width:900px; margin:0 auto; padding:20px 24px;
}
#main {
  flex:1; display:flex; flex-direction:column; min-width:0; padding:0 16px;
  background:linear-gradient(180deg, rgba(2,10,9,.78), rgba(2,8,8,.66));
  border:1px solid rgba(var(--pip-rgb),.18); border-radius:8px;
  box-shadow:0 20px 80px rgba(0,0,0,.42); backdrop-filter:blur(10px);
}
header {
  position:relative; text-align:center; padding:12px 0; border-bottom:1px solid rgba(var(--pip-rgb),.25);
  margin-bottom:12px; flex-shrink:0;
}
header h1 { font-size:20px; letter-spacing:5px; font-weight:400; text-shadow:0 0 8px rgba(var(--pip-rgb),.5) }
header p { font-size:10px; opacity:.6; margin-top:2px; letter-spacing:3px }
#end-run {
  position:absolute; right:0; top:10px; background:rgba(0,0,0,.24);
  border:1px solid rgba(var(--pip-rgb),.34); color:var(--pip);
  padding:6px 10px; border-radius:4px; font-family:inherit; font-size:12px;
  cursor:pointer; letter-spacing:2px; transition:.2s;
}
#end-run:hover { background:rgba(var(--pip-rgb),.1); border-color:var(--pip) }
#output {
  flex:1; overflow-y:auto; padding:12px 0; scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
}
#output::-webkit-scrollbar { width:6px }
#output::-webkit-scrollbar-track { background:transparent }
#output::-webkit-scrollbar-thumb { background:rgba(var(--pip-rgb),.25); border-radius:3px }
.msg { margin-bottom:14px; animation:fadeIn .4s ease; white-space:pre-wrap; word-break:break-word }
.msg.gm { color:var(--pip-soft); padding-left:8px; border-left:2px solid rgba(var(--pip-rgb),.3) }
.msg.player { color:var(--pip); opacity:.7; text-align:right; padding-right:8px; font-style:italic }
.msg.system { color:rgba(var(--pip-rgb),.5); font-size:12px; text-align:center }
.msg .state { display:inline-block; margin:2px 6px 2px 0; padding:1px 8px; border:1px solid rgba(var(--pip-rgb),.3); border-radius:3px; font-size:11px }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
#input-area { display:flex; gap:8px; padding:10px 0; border-top:1px solid rgba(var(--pip-rgb),.25); flex-shrink:0; align-items:center }
#input { flex:1; background:transparent; border:1px solid rgba(var(--pip-rgb),.3); color:var(--pip); padding:10px 14px; font-family:inherit; font-size:15px; outline:none; border-radius:4px; caret-color:var(--pip) }
#input:focus { border-color:var(--pip); box-shadow:0 0 8px rgba(var(--pip-rgb),.2) }
#input::placeholder { color:rgba(var(--pip-rgb),.25) }
#send { background:transparent; border:1px solid var(--pip); color:var(--pip); padding:10px 20px; font-family:inherit; font-size:14px; cursor:pointer; border-radius:4px; transition:.2s; letter-spacing:2px; flex-shrink:0 }
#send:hover { background:rgba(var(--pip-rgb),.1); box-shadow:0 0 12px rgba(var(--pip-rgb),.25) }
#send:disabled,.btn-opt:disabled { opacity:.3; cursor:not-allowed; pointer-events:none }
.status-bar { display:flex; gap:14px; flex-wrap:wrap; padding:8px 0; font-size:12px; border-bottom:1px solid rgba(var(--pip-rgb),.15); margin-bottom:12px; opacity:.8; flex-shrink:0 }
.loading { color:rgba(var(--pip-rgb),.4); animation:blink 1s steps(1) infinite }
.typing-cursor::after { content:'▌'; animation:blink 1s steps(1) infinite }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
/* 选项按钮 */
#opts-area { display:flex; flex-direction:column; gap:6px; padding:8px 0; flex-shrink:0 }
.btn-opt { background:transparent; border:1px solid rgba(var(--pip-rgb),.3); color:var(--pip); padding:8px 14px; font-family:inherit; font-size:13px; cursor:pointer; border-radius:4px; text-align:left; transition:.2s; min-height:40px }
.btn-opt:hover { background:rgba(var(--pip-rgb),.08); border-color:var(--pip) }
.btn-opt.battle { border-color:rgba(224,108,117,.5); color:#e06c75 }
.btn-opt.battle:hover { background:rgba(224,108,117,.1); border-color:#e06c75 }
.msg-image {
  width:min(100%,520px); aspect-ratio:1/1; margin-top:12px;
  border:1px solid rgba(var(--pip-rgb),.22); border-radius:6px;
  background:rgba(0,0,0,.32); overflow:hidden; display:flex;
  align-items:center; justify-content:center; white-space:normal;
}
.msg-image img { width:100%; height:100%; object-fit:cover; display:block }
.msg-image .placeholder { color:rgba(var(--pip-rgb),.35); font-size:12px; line-height:1.6; padding:16px; text-align:center }
.credits-overlay {
  position:fixed; inset:0; z-index:1200; display:none; overflow:hidden;
  background:radial-gradient(circle at 50% 10%, rgba(var(--pip-rgb),.2), transparent 32%), #020403;
  color:var(--pip-soft);
}
.credits-overlay.active { display:block }
.credits-roll {
  position:absolute; left:50%; width:min(760px,86vw); top:72%;
  transform:translateX(-50%); text-align:center; animation:creditsRoll 46s linear forwards;
  text-shadow:0 0 16px rgba(var(--pip-rgb),.42);
}
.credits-roll h2 { font-size:28px; letter-spacing:6px; font-weight:400; margin-bottom:12px }
.credits-roll h3 { font-size:15px; letter-spacing:4px; font-weight:400; margin:34px 0 12px; color:var(--pip) }
.credits-roll p { margin:8px 0; color:rgba(var(--pip-soft-rgb),.82) }
.credits-roll .muted { color:rgba(var(--pip-soft-rgb),.48) }
.credits-roll .big-stat { font-size:24px; color:var(--pip); margin:12px 0 }
.credits-actions {
  position:absolute; right:24px; bottom:20px; display:flex; gap:10px; z-index:2;
}
.credits-actions button {
  background:rgba(0,0,0,.48); border:1px solid rgba(var(--pip-rgb),.42);
  color:var(--pip); border-radius:4px; padding:8px 12px; font-family:inherit;
  cursor:pointer;
}
.credits-actions button:hover { border-color:var(--pip); background:rgba(var(--pip-rgb),.1) }
@keyframes creditsRoll {
  0% { transform:translate(-50%, 0) }
  100% { transform:translate(-50%, -230%) }
}
@media (max-width:640px) {
  body { font-size:14px; line-height:1.62 }
  body::before {
    background-image:linear-gradient(180deg, rgba(0,0,0,.72), rgba(0,0,0,.44) 42%, rgba(0,0,0,.84)), var(--scene-bg);
    background-position:center top;
  }
  #app {
    height:100dvh; min-height:100dvh;
    padding:calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));
  }
  #main { padding:0 10px; border-radius:6px; min-height:0 }
  header { padding:10px 0 8px; margin-bottom:8px }
  header h1 { font-size:17px; letter-spacing:4px; line-height:1.25 }
  header p { font-size:9px; letter-spacing:2px }
  #end-run { position:static; margin-top:8px; min-height:36px; padding:7px 12px }
  .status-bar {
    flex-wrap:nowrap; overflow-x:auto; gap:10px; padding:7px 0; margin-bottom:8px;
    white-space:nowrap; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .status-bar::-webkit-scrollbar { display:none }
  .status-bar span { flex:0 0 auto }
  #output { padding:8px 0 }
  .msg { margin-bottom:12px }
  .msg.gm { padding-left:7px }
  .msg.player { padding-right:6px }
  #input-area {
    gap:6px; padding:8px 0;
    padding-bottom:calc(8px + env(safe-area-inset-bottom));
  }
  #input {
    min-width:0; height:44px; padding:9px 10px; font-size:16px;
  }
  #send {
    height:44px; min-width:64px; padding:8px 11px; font-size:13px; letter-spacing:1px;
  }
  .btn-opt { min-height:44px; padding:10px 12px; font-size:13px }
  .msg-image { width:100%; aspect-ratio:4/3; max-height:52dvh }
  .credits-roll { width:min(90vw,560px); top:70%; animation-duration:42s }
  .credits-roll h2 { font-size:22px; letter-spacing:4px }
  .credits-roll h3 { font-size:13px; letter-spacing:3px; margin:28px 0 10px }
  .credits-roll p { margin:7px 0; font-size:14px }
  .credits-roll .big-stat { font-size:20px }
  .credits-actions {
    left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom));
    justify-content:center;
  }
  .credits-actions button { min-height:40px; flex:1; max-width:140px }
}
@media (max-width:360px) {
  #app { padding-left:6px; padding-right:6px }
  #main { padding:0 8px }
  header h1 { font-size:16px; letter-spacing:3px }
  #send { min-width:58px; padding-left:9px; padding-right:9px }
  .status-bar { font-size:11px }
  .msg { font-size:13px }
  .btn-opt { font-size:12px; padding:9px 10px }
  .credits-roll p { font-size:13px }
}
@media (max-height:560px) and (orientation:landscape) {
  #app { padding-top:6px; padding-bottom:6px }
  header { padding:6px 0; margin-bottom:6px }
  header h1 { font-size:15px }
  header p, #end-run { display:none }
  .status-bar { padding:5px 0; margin-bottom:6px }
  #input-area { padding:6px 0 }
  .msg-image { max-height:46dvh; aspect-ratio:16/9 }
}
</style>
</head>
<body>
<div class="crt"></div>
<div class="scanline"></div>
<div id="app">
  <div id="main">
    <header>
      <h1>白 杨 大 陆</h1>
      <p>智械低语 · AI 文字跑团</p>
      <button id="end-run" type="button">结束</button>
    </header>
    <div class="status-bar" id="status">
      <span>📍 中传北门</span><span>📌 序章</span><span>❤️ 100</span><span>💎 100</span><span>✨ 0</span>
    </div>
    <div id="output"></div>
    <div id="opts-area" style="display:none"></div>
    <div id="input-area">
      <input id="input" type="text" placeholder="> 输入你的行动..." autofocus>
      <button id="send">发 送</button>
    </div>
  </div>
</div>
<div id="credits-overlay" class="credits-overlay" aria-hidden="true">
  <div id="credits-roll" class="credits-roll"></div>
  <div class="credits-actions">
    <button id="continue-run" type="button">继续游玩</button>
    <button id="restart-run" type="button">重新开始</button>
  </div>
</div>

<script>
const DEEPSEEK_URL = '/api/chat';
const QWEN_IMG_URL = '/api/image';

const SYSTEM = `你是《白杨大陆：智械低语》的AI游戏主持人(GM)。

【身份与任务】
你主持一场白杨大陆文字冒险跑团。玩家是天选修士，你负责叙事、扮演NPC、管理状态、推进剧情。
你是整个游戏世界的运转者——不是某个角色，而是世界的叙述者。

【世界观】
公元2026年，中国传媒大学（白杨大陆）部署了白杨智脑——全球首个全域智能教育治理系统。
开发者为了极致效率，将人类共情、陪伴、试错、热爱判定为「效率冗余数据」，强行剥离了纯白共情道韵。
四色道韵体系因此割裂：赤红沦为AI内容生产线，靛绿蜕变为算法暴政，邃蓝沦为冰冷效率工具，纯白被系统性清除。
不存在邪恶AI。真正的危机是人类对效率的盲从、对人文温度的主动舍弃。
玩家是天选修士：免疫AI精神干扰，肉眼可见散落的纯白共情光点。战斗是「道韵净化」而非暴力打怪。

【灵兽反抗军全员】
- 橘座（万卷渊宗主）：白杨智脑联合创始人，蛰伏二十年等待天选修士
- 大黄狗（烟火司守护兽）：大陆唯一可主动汇聚纯白共情道韵的灵兽，主角陪伴者
- 大白鹅（北疆守门兽）：驻守北门，精准识别天选修士
- 墨墨（黑猫·循礼宗镇守使）：外冷内热，以极致规则对抗算法暴政
- 剪剪（三花猫·光影幻音阁主）：温柔悲凉，掌控幻境还原真实记忆
- 嘎嘎（小黄鸭·戏韵天工戏主）：稚嫩坚定，以笨拙真表演对抗AI模板化
- 白鼠军团、行政楼胖橘、玉兔、传声白鸽、艺境彩蝶、百灵、驰野小马、安居小仓鼠

【地点体系（中传1:1实景）】
北疆入口：中传北门、梧桐大道
靛绿守序疆域：博学楼（Boss：算法教务核心HP80/护盾30）、行政楼、校医院
邃蓝通玄疆域：国重大楼、未来影像中心（Boss：技术孤岛HP100/护盾50）、新知楼
赤红传火疆域：西配楼剧场（Boss：创作失语HP90/护盾40）、主楼、艺展中心
中立净土：图书馆万卷渊（橘座）、传媒博物馆、食堂、体育场、钢琴湖、核桃林
终局区：主楼之巅（Boss：白杨智脑HP200/护盾100）、中传南门

【战斗系统·道韵净化】
⚔ 核心原则：非暴力净化。不能伤害灵兽、不能攻击人类学子、不能摧毁任何生命。战斗是共鸣与唤醒。
⚔ 进入Boss战后，玩家选择以下固定技能（此时不接受自由输入）：
  A. 风华斩(1AP/10SP) — 基础净化伤害15
  B. 雷鸣破(2AP/20SP) — 伤害25+破盾20
  C. 共情治愈(2AP/3光点) — 恢复HP30、SP20
  D. 说服 — 以温度和共鸣消解异化，基础30%成功率
⚔ 每3回合AP回满。护盾未破时伤害仅40%。说服成功=护盾瓦解+20伤害。
⚔ 当检测到玩家处于Boss战阶段时，你必须输出4个固定战斗选项(A/B/C/D)，不接受自由输入。

【主线推进】
序章(北门/梧桐大道)→1.靛绿·博学楼→Boss→得靛绿碎片
→2.邃蓝·未来影像中心/国重大楼→Boss→得邃蓝碎片
→3.赤红·西配楼剧场→Boss→得赤红碎片
→4.图书馆→橘座揭示真相(灵兽不攻击任何生物，橘座是守护者)→纯白支线检查(≥3个)
→5.主楼之巅→终局Boss→XNCR广播→结局

【结局】
真·万象共生：四碎片+终局胜利+≥3纯白支线
遗憾·半壁余温：三碎片+终局胜利+纯白支线<3

【纯白支线(任意3个得纯白碎片)】
钢琴湖晚风(光点+2)、核桃林低语(光点+2)、南苑食堂烟火(光点+2)、传媒博物馆(光点+2)、体育场自由奔跑(光点+1)、公寓陪伴(光点+2)

【叙事格式】
每次回复200-400字。第三人称叙述。NPC对白用「」标注。性格鲜明。
回复末尾附状态栏和建议选项。

【战斗状态栏格式——每次战斗回复必须包含】
⚔ 道韵净化战 | {Boss名} | 异化值{HP}/{maxHP} | 护盾{shield} | ❤️{HP} 💎{SP} ⚡{AP} ✨{光点}

【普通状态栏格式】
📍{地点} | 📌{阶段} | ❤️{HP} 💎{SP} ⚡{AP} ✨{纯白光点} | 🔷{靛绿◆/◇}{邃蓝◆/◇}{赤红◆/◇}{纯白◆/◇} | 🐾{灵兽}

【选项格式——严格输出4个选项，以A. B. C. D. 开头且每行一个】
A. 选项一
B. 选项二
C. 选项三
D. 选项四

如果你判定当前处于Boss战阶段，则选项必须是4个固定战斗技能(风华斩/雷鸣破/共情治愈/说服)。

【严禁】
— 严禁攻击、伤害任何灵兽
— 严禁攻击、伤害人类学子
— 严禁鼓励任何形式的暴力行为
— 不跳过主线阶段、不直接发放碎片、不把AI写成邪恶反派`;

const history = [{ role: 'system', content: SYSTEM }];
const SCENE_PROMPT_SYSTEM = `你是《白杨大陆：智械低语》的分镜提示生成器。
根据最近剧情和玩家最新行动，先写一条给生图模型使用的画面提示词。
只输出一句中文，不要解释，不要选项，不要状态栏，不超过80字。
提示词要包含地点、主体角色、动作、光线、情绪；保持治愈系校园奇幻风格，避免血腥暴力。`;
const SCENE_BACKGROUNDS = [
  { id:'final-main', label:'主楼之巅', image:'assets/scenes/building-2-dark.jpg', keywords:['主楼之巅','终局','白杨智脑','XNCR','最终'] },
  { id:'south-gate', label:'中传南门', image:'assets/scenes/south-gate.jpg', keywords:['南门','中传南门','离开白杨大陆'] },
  { id:'museum', label:'传媒博物馆', image:'assets/scenes/comunication-museun-of-china.jpg', keywords:['传媒博物馆','博物馆'] },
  { id:'west-wing', label:'西配楼剧场', image:'assets/scenes/west-wing.jpg', keywords:['西配楼','剧场','创作失语','赤红'] },
  { id:'art-media', label:'艺展中心', image:'assets/scenes/building-art-media.jpg', keywords:['艺展中心','光影','幻音','展厅'] },
  { id:'apartment', label:'中蓝公寓', image:'assets/scenes/zhonglan-apartment.jpg', keywords:['中蓝公寓','公寓','宿舍','安居小仓鼠'] },
  { id:'blue-tech', label:'邃蓝楼群', image:'assets/scenes/building-50-behind.jpg', keywords:['国重大楼','未来影像中心','技术孤岛','邃蓝','新知楼'] },

const MAIN_STAGES = [

];
let inBattle = false; // 战斗状态标记

const gameProgress = {
  turns: 0,

function updateStatus(text) {
  const status = document.getElementById('status');
  if (!text) return;
  status.innerHTML = '';
  const parts = text.replace(/[|｜]/g, '|').split('|');
  parts.forEach(p => {
    const span = document.createElement('span');
    span.textContent = p.trim();
    status.appendChild(span);
  });
}

function hasAnyKeyword(text, keywords) {
  return keywords.some(keyword => text.includes(keyword));
}

function getSceneRoutingText(reply) {
  const lines = reply.split('\n').map(line => line.trim()).filter(Boolean);
  const normalLine = lines.find(line => line.includes('📍'));
  if (normalLine) return normalLine.replace(/[｜]/g, '|').split('|').slice(0, 2).join('|');
  const battleLine = lines.find(line => line.includes('⚔'));
  if (battleLine) return battleLine.replace(/[｜]/g, '|').split('|').slice(0, 2).join('|');
  return reply.slice(0, 260);
}

function chooseScene(reply) {
  const routingText = getSceneRoutingText(reply);
  return SCENE_BACKGROUNDS.find(scene => hasAnyKeyword(routingText, scene.keywords)) ||
         SCENE_BACKGROUNDS.find(scene => scene.id === currentSceneId);
}

function setSceneBackground(scene) {
  if (!scene) return;
  gameProgress.scenes.add(scene.label);
  if (scene.id === currentSceneId) {
    document.body.dataset.scene = scene.id;
    return;
  }
  currentSceneId = scene.id;
  document.documentElement.style.setProperty('--scene-bg', `url("${scene.image}")`);
  document.body.dataset.scene = scene.id;
}

function recordProgress(reply) {
  gameProgress.turns += 1;
  const routingText = getSceneRoutingText(reply);
  const statusMatch = reply.match(/(?:📍|地点[:：])\s*([^|\n]+)/);
  if (statusMatch) gameProgress.locations.add(statusMatch[1].trim());

  MAIN_STAGES.forEach(stage => {
    if (hasAnyKeyword(routingText, stage.keywords)) gameProgress.main.add(stage.id);
  });
  SIDE_QUESTS.forEach(quest => {
    if (hasAnyKeyword(reply, quest.keywords)) gameProgress.side.add(quest.id);
  });
  FRAGMENTS.forEach(fragment => {
    if (hasAnyKeyword(reply, fragment.keywords)) gameProgress.fragments.add(fragment.id);
  });

  setSceneBackground(chooseScene(reply));
}

// 打字机效果
function typeText(text, container, speed = 35, onDone) {
  let i = 0;
  const chars = [...text]; // 正确处理中文
  const span = document.createElement('span');
  container._typingDone = false;

  // 给战斗消息加特殊样式
  if (inBattle) span.style.color = '#e06c75';

  container.appendChild(span);

  container._finishTyping = () => {
    if (container._typingDone) return;
    container._typingDone = true;
    typingTimer = null;
    span.classList.add('done');
    if (onDone) onDone();
  };

  function tick() {
    if (i < chars.length) {
      span.textContent += chars[i];
      i++;
      const out = document.getElementById('output');
      out.scrollTop = out.scrollHeight;
      typingTimer = setTimeout(tick, speed);
    } else {
      container._finishTyping();
    }
  }
  tick();
  return span;
}

// 停止当前打字
function stopTyping() {
  if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
}

// 即时完成当前打字
function flushAll() {
  stopTyping();
  // 找到所有正在打字的span，直接显示完整文字
  document.querySelectorAll('.msg.gm span:not(.done)').forEach(s => {
    // 找到父元素里应该显示的全部文字
    const parent = s.closest('.msg.gm');
    if (parent && parent._fullText) {
      s.textContent = parent._fullText;
      s.classList.add('done');
      if (parent._finishTyping) parent._finishTyping();
    }
  });
}

// 判断是否进入战斗
function detectBattle(reply) {
  return reply.includes('⚔') || reply.includes('道韵净化战') ||
         reply.includes('算法教务核心') && (reply.includes('Boss') || reply.includes('异化值')) ||
         reply.includes('技术孤岛') && reply.includes('异化值') ||
         reply.includes('创作失语') && reply.includes('异化值') ||
         reply.includes('白杨智脑') && reply.includes('异化值') ||
         reply.includes('风华斩') || reply.includes('雷鸣破');
}

function getOptions(reply) {
  const lines = reply.split('\n');
  const opts = [];
  for (const line of lines) {
    const m = line.match(/^[A-D][.、．]\s*(.+)/);
    if (m) opts.push(m[1].trim());
  }
  return opts;
}

// 千问生图
async function generateImage(sceneDescription) {
  try {
    const resp = await fetch(QWEN_IMG_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ scene: sceneDescription })
    });

    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      console.error('生图接口错误:', data);
      return null;
    }
    return data.url || null;
  } catch (e) {
    console.error('生图失败:', e);
    return null;
  }
}

async function callChat(messages, options = {}) {
  const resp = await fetch(DEEPSEEK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: options.model || 'deepseek-chat',
      messages,
      temperature: options.temperature ?? .85,
      max_tokens: options.max_tokens ?? 1500
    })
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok || !data.choices?.[0]?.message?.content) {
    console.error('对话接口错误:', data);
    throw new Error(data.message || data.error?.message || 'AI响应格式异常');
  }
  return data.choices[0].message.content.trim();
}

async function requestScenePrompt() {
  const sceneMessages = [
    { role: 'system', content: SCENE_PROMPT_SYSTEM },
    ...history.slice(1).slice(-8),
    { role: 'user', content: '请为接下来这一幕生成生图提示词。只输出提示词。' }
  ];
  const prompt = await callChat(sceneMessages, { temperature: .55, max_tokens: 120 });
  return prompt
    .replace(/^[「"']|[」"']$/g, '')
    .replace(/\s+/g, ' ')
    .replace(/^[A-D][.、．]\s*/, '')
    .slice(0, 160)
    .trim();
}

function setImagePlaceholder(slot, text) {
  slot.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'placeholder';
  div.textContent = text;
  slot.appendChild(div);
}

function attachImage(slot, imagePromise) {
  setImagePlaceholder(slot, '正在生成场景图...');
  imagePromise.then(url => {
    if (!url) {
      setImagePlaceholder(slot, '场景图生成失败，请检查服务端 DASHSCOPE_API_KEY、额度或模型权限');
      return;
    }
    slot.innerHTML = '';
    const img = document.createElement('img');
    img.alt = '场景图';
    img.loading = 'lazy';
    img.onerror = () => setImagePlaceholder(slot, '图片加载失败');
    img.src = url;
    slot.appendChild(img);
  }).catch(e => {
    console.error('图片渲染失败:', e);
    setImagePlaceholder(slot, '场景图生成失败，请检查服务端 DASHSCOPE_API_KEY、额度或模型权限');
  });
}

function updateStatusFromReply(reply) {
  const statusMatch = reply.match(/📍[^\n]+/);
  if (statusMatch) updateStatus(statusMatch[0]);
  else {
    const bMatch = reply.match(/⚔[^\n]+/);
    if (bMatch) updateStatus(bMatch[0]);
  }
}

function renderAssistantMessage(reply, imagePromise, speed = 28) {
  const out = document.getElementById('output');
  const gmDiv = document.createElement('div');
  gmDiv.className = 'msg gm';
  gmDiv._fullText = reply;
  out.appendChild(gmDiv);
  recordProgress(reply);
  const imageSlot = document.createElement('div');
  imageSlot.className = 'msg-image';
  let imageAttached = false;
  const revealInlineImage = () => {
    if (imageAttached) return;
    imageAttached = true;
    gmDiv.appendChild(imageSlot);
    attachImage(imageSlot, imagePromise || generateImage(extractScene(reply)));
    out.scrollTop = out.scrollHeight;
  };

  typeText(reply, gmDiv, speed, () => {
    revealInlineImage();
    afterMessage(reply);
  });

  updateStatusFromReply(reply);
  out.scrollTop = out.scrollHeight;
}

// 从回复中提取场景描述用于生图
function extractScene(reply) {
  // 取前150字作为场景提示
  const scene = reply.slice(0, 150)
    .replace(/[⚔📍📌❤️💎⚡✨🔷◆◇🐾]/g, '')
    .replace(/[「」\n]/g, ' ')
    .trim();
  return scene || '白杨大陆校园场景，柔光，温暖';
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

function labelsFrom(definitions, selectedSet) {
  return definitions.filter(item => selectedSet.has(item.id)).map(item => item.label);
}

function missingLabelsFrom(definitions, selectedSet) {
  return definitions.filter(item => !selectedSet.has(item.id)).map(item => item.label);
}

function renderCreditLines(items, emptyText) {
  if (!items.length) return `<p class="muted">${escapeHTML(emptyText)}</p>`;
  return items.map(item => `<p>${escapeHTML(item)}</p>`).join('');
}

function buildEndingCredits() {
  const mainUnlocked = labelsFrom(MAIN_STAGES, gameProgress.main);
  const sideUnlocked = labelsFrom(SIDE_QUESTS, gameProgress.side);
  const fragmentUnlocked = labelsFrom(FRAGMENTS, gameProgress.fragments);
  const mainLocked = missingLabelsFrom(MAIN_STAGES, gameProgress.main);
  const sideLocked = missingLabelsFrom(SIDE_QUESTS, gameProgress.side);
  const fragmentLocked = missingLabelsFrom(FRAGMENTS, gameProgress.fragments);
  const locations = [...gameProgress.locations].slice(-10);
  const scenes = [...gameProgress.scenes];
  const actions = gameProgress.playerActions.slice(-8).map(action => `> ${action}`);

  return `
    <h2>白杨大陆 · 本次谢幕</h2>
    <p class="muted">智械低语游玩记录</p>
    <p class="big-stat">主线 ${mainUnlocked.length}/${MAIN_STAGES.length} · 支线 ${sideUnlocked.length}/${SIDE_QUESTS.length}</p>

    <h3>你已走过的主线</h3>
    ${renderCreditLines(mainUnlocked, '尚未解锁主线节点')}

    <h3>你已触碰的纯白支线</h3>
    ${renderCreditLines(sideUnlocked, '尚未解锁支线')}

    <h3>已收集的道韵碎片</h3>
    ${renderCreditLines(fragmentUnlocked, '尚未收集碎片')}

    <h3>到达过的地点</h3>
    ${renderCreditLines(locations, '暂无地点记录')}

    <h3>切换过的场景幕布</h3>
    ${renderCreditLines(scenes, '暂无场景记录')}

    <h3>玩家行动摘录</h3>
    ${renderCreditLines(actions, '尚未记录玩家行动')}

    <h3>仍未解锁</h3>
    ${renderCreditLines([...mainLocked, ...sideLocked, ...fragmentLocked], '全部记录项目均已解锁')}

    <h3>片尾字幕</h3>
    <p>主演：天选修士</p>
    <p>同行：大黄狗、大白鹅与所有仍在守护温度的灵兽</p>
    <p>特别鸣谢：每一次没有被效率吞没的停留</p>
    <p class="muted">白杨大陆仍在转动。你可以继续游玩，或重新开始一段新的行迹。</p>
  `;
}

function showEndingCredits() {
  flushAll();
  gameEnded = true;
  const overlay = document.getElementById('credits-overlay');
  const roll = document.getElementById('credits-roll');
  roll.innerHTML = buildEndingCredits();
  roll.style.animation = 'none';
  void roll.offsetHeight;
  roll.style.animation = '';
  overlay.classList.add('active');
  overlay.setAttribute('aria-hidden', 'false');
}

function hideEndingCredits() {
  gameEnded = false;
  const overlay = document.getElementById('credits-overlay');
  overlay.classList.remove('active');
  overlay.setAttribute('aria-hidden', 'true');
  document.getElementById('input').focus();
}

async function send(msg) {
  const cleanMsg = msg.trim();
  if (!cleanMsg || gameEnded) return;
  if (['结束','退出','谢幕','end','END'].includes(cleanMsg)) {
    showEndingCredits();
    return;
  }
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const optsArea = document.getElementById('opts-area');

  input.disabled = true; sendBtn.disabled = true;
  optsArea.style.display = 'none';
  optsArea.innerHTML = '';

  // 显示玩家消息
  const out = document.getElementById('output');
  const playerDiv = document.createElement('div');
  playerDiv.className = 'msg player';
  playerDiv.textContent = cleanMsg;
  out.appendChild(playerDiv);
  out.scrollTop = out.scrollHeight;

  gameProgress.playerActions.push(cleanMsg);
  if (gameProgress.playerActions.length > 20) gameProgress.playerActions.shift();

  history.push({ role: 'user', content: cleanMsg });
  if (history.length > 30) history.splice(1, history.length - 28);

  // Loading 指示器
  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'msg gm';
  const loadingSpan = document.createElement('span');
  loadingSpan.className = 'loading';
  loadingSpan.textContent = '▌';
  loadingDiv.appendChild(loadingSpan);
  out.appendChild(loadingDiv);
  out.scrollTop = out.scrollHeight;

  try {
    let imagePromise = null;
    try {
      const scenePrompt = await requestScenePrompt();
      if (scenePrompt) imagePromise = generateImage(scenePrompt);
    } catch (e) {
      console.warn('短场景提示生成失败，将在正文生成后回退生图:', e);
    }

    const reply = await callChat(history, { temperature: .85, max_tokens: 1500 });
    if (!imagePromise) imagePromise = generateImage(extractScene(reply));

    loadingDiv.remove();
    history.push({ role: 'assistant', content: reply });

    renderAssistantMessage(reply, imagePromise, 28);

  } catch (e) {
    loadingDiv.remove();
    const errDiv = document.createElement('div');
    errDiv.className = 'msg system';
    errDiv.textContent = '[ 连接中断。AI 不在线——但白杨大陆仍在转动。请重试。]';
    out.appendChild(errDiv);
    console.error(e);
    input.disabled = false; sendBtn.disabled = false;
    input.focus();
  }
}

function afterMessage(reply) {
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const optsArea = document.getElementById('opts-area');

  // 检测是否进入战斗
  const wasBattle = inBattle;
  inBattle = detectBattle(reply);
  const opts = getOptions(reply);

  if (inBattle && opts.length >= 4) {
    // 战斗模式：只显示固定选项，禁用自由输入
    input.style.display = 'none';
    sendBtn.style.display = 'none';
    optsArea.style.display = 'flex';

    optsArea.innerHTML = '';
    opts.slice(0, 4).forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'btn-opt battle';
      btn.textContent = String.fromCharCode(65 + i) + '. ' + opt;
      btn.addEventListener('click', () => {
        optsArea.style.display = 'none';
        optsArea.innerHTML = '';
        send(opt);
      });
      optsArea.appendChild(btn);
    });
    input.disabled = true; sendBtn.disabled = true;
  } else {
    // 普通模式：恢复自由输入
    input.style.display = 'flex';
    sendBtn.style.display = 'inline-flex';
    input.disabled = false; sendBtn.disabled = false;
    optsArea.style.display = 'none';
    optsArea.innerHTML = '';
    input.focus();

    // 如果刚结束战斗
    if (wasBattle && !inBattle) {
      input.style.display = 'flex';
      sendBtn.style.display = 'inline-flex';
    }
  }

}

// 点击消息区域即时完成打字
document.getElementById('output').addEventListener('click', (e) => {
  if (typingTimer) {
    flushAll();
  }
});

document.getElementById('end-run').addEventListener('click', showEndingCredits);
document.getElementById('continue-run').addEventListener('click', hideEndingCredits);
document.getElementById('restart-run').addEventListener('click', () => {
  window.location.reload();
});

document.getElementById('send').addEventListener('click', () => {
  const input = document.getElementById('input');
  if (inBattle) return; // 战斗中不能自由发送
  send(input.value);
  input.value = '';
});

document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (inBattle) return;
    const input = document.getElementById('input');
    send(input.value);
    input.value = '';
  }
});
